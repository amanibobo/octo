<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 18 18" role="img" aria-label="Octo">
  <!-- Same geometry as the app's cursor buddy: 18×18, corner 4.5, two 4.5 eyes 3.5 apart, nudged 1 up. -->
  <rect x="0" y="0" width="18" height="18" rx="4.5" ry="4.5" fill="#22C55E"/>
  <g transform="translate(0 -1)">
    <!-- Each eye squashes to a slit for ~130 ms roughly every 3.4 s, with an occasional double blink. -->
    <circle cx="5" cy="9" r="2.25" fill="#ffffff">
      <animateTransform attributeName="transform" type="scale" additive="sum"
        values="1 1;1 1;1 0.12;1 1;1 1;1 0.12;1 1;1 1"
        keyTimes="0;0.55;0.57;0.59;0.62;0.64;0.66;1"
        dur="6.8s" repeatCount="indefinite"
        calcMode="linear" transform-origin="5 9" style="transform-origin: 5px 9px; transform-box: fill-box;"/>
    </circle>
    <circle cx="13" cy="9" r="2.25" fill="#ffffff">
      <animateTransform attributeName="transform" type="scale" additive="sum"
        values="1 1;1 1;1 0.12;1 1;1 1;1 0.12;1 1;1 1"
        keyTimes="0;0.55;0.57;0.59;0.62;0.64;0.66;1"
        dur="6.8s" repeatCount="indefinite"
        calcMode="linear" style="transform-origin: 13px 9px; transform-box: fill-box;"/>
    </circle>
  </g>
</svg>
